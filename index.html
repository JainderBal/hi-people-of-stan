<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Creator Collab Engine pitch for HackAI Toronto by Jainder Bal.">
<meta property="og:title" content="Hi People of Stan">
<meta property="og:description" content="Creator Collab Engine pitch for HackAI Toronto.">
<meta property="og:type" content="video.other">
<meta property="og:url" content="https://jainderbal.github.io/hi-people-of-stan/">
<meta property="og:image" content="https://jainderbal.github.io/hi-people-of-stan/poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>Hi People of Stan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700&display=swap">
<style>
/* One Stan-blue room: centered greeting, the pitch on a raised 3D card, contact at the foot. */
:root{--stan:#4f3ff0;--deep:#2f25a8;--edge:#1d1578;--paper:#fff;--soft:#dcd8ff;--line:rgba(255,255,255,.34);--display:"Space Grotesk",Inter,Arial,sans-serif;--body:Inter,-apple-system,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--stan);color:var(--paper);font-family:var(--body);overflow-x:clip}
main{width:min(100%,1180px);margin:0 auto;padding-block:clamp(40px,6vw,76px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:clamp(34px,5vw,60px)}
h1{margin:0;text-align:center;font-family:var(--display);font-size:clamp(46px,10.2vw,128px);line-height:.98;letter-spacing:-.045em;font-weight:700;text-wrap:balance}
.w{display:inline-block;white-space:nowrap}
.l{display:inline-block;animation:in .62s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 125ms + 180ms)}
@keyframes in{from{opacity:0;transform:translateY(.22em)}to{opacity:1;transform:none}}
.contact{display:grid;justify-items:center;gap:14px;text-align:center;margin-top:calc(clamp(12px,2.6vw,32px) * -1)}
.who{min-width:0}.name{font-size:clamp(21px,2.4vw,26px);font-weight:600}.role{margin-top:4px;color:var(--soft);font-size:15px;line-height:1.45}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:100%}
.links a,.mail{color:var(--paper);text-decoration:none;font-weight:600;font-size:15px;min-height:44px;padding:0 17px;border:1.5px solid var(--line);border-radius:8px;display:inline-flex;align-items:center}
.links a:hover{background:var(--paper);color:var(--stan)}
.mail{gap:12px;padding-right:6px;min-width:0;max-width:100%}.mail span{user-select:all;overflow-wrap:anywhere}
#copy{font:600 13px var(--body);color:var(--stan);background:var(--paper);border:0;border-radius:5px;padding:7px 10px;cursor:pointer}
.links a:focus-visible,video:focus-visible,#copy:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.stage{margin:0;perspective:1500px;padding-bottom:clamp(14px,3vw,30px)}
.card{--rx:7deg;--ry:0deg;--mx:50%;--my:20%;position:relative;padding:clamp(6px,1vw,12px);border-radius:clamp(12px,1.6vw,20px);background:linear-gradient(150deg,#8d82ff,#5a4bf5 42%,#3327bd);transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .22s ease-out;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 2px 0 #30259f,0 5px 0 #2a2092,0 9px 0 #241b85,0 14px 0 var(--edge),0 34px 46px rgba(14,8,82,.5),0 62px 100px rgba(14,8,82,.42)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.2),transparent 42%);transition:opacity .25s}
.card.playing{--rx:0deg!important;--ry:0deg!important}.card.playing::after{opacity:0}
video{display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:var(--deep);border-radius:clamp(7px,1vw,11px)}
.play{position:absolute;left:50%;top:50%;z-index:2;width:clamp(68px,9vw,104px);height:clamp(68px,9vw,104px);padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:var(--paper);color:var(--stan);cursor:pointer;transform:translate(-50%,-50%) translateZ(36px);transition:transform .16s ease-out,opacity .16s;box-shadow:inset 0 -3px 0 #d8d4ff,0 4px 0 #bdb6ff,0 8px 0 var(--deep),0 22px 34px rgba(14,8,82,.55)}
.play svg{width:42%;height:42%;margin-left:7%;fill:currentColor}
.play:hover{transform:translate(-50%,-50%) translateZ(36px) scale(1.07)}.play:active{transform:translate(-50%,-52%) translateZ(36px) scale(.97)}
.play:focus-visible{outline:3px solid var(--paper);outline-offset:4px}
.play.off{opacity:0;pointer-events:none}
@media (max-width:600px){.card{--rx:4deg}}
@media (prefers-reduced-motion:reduce){.l{animation:none}.card{--rx:0deg;transition:none}}
</style>
</head>
<body>
<main>
<h1 aria-label="Hi People of Stan"><span aria-hidden="true"><span class="w"><span class="l" style="--i:0">H</span><span class="l" style="--i:1">i</span></span> <span class="w"><span class="l" style="--i:2">P</span><span class="l" style="--i:3">e</span><span class="l" style="--i:4">o</span><span class="l" style="--i:5">p</span><span class="l" style="--i:6">l</span><span class="l" style="--i:7">e</span></span> <span class="w"><span class="l" style="--i:8">o</span><span class="l" style="--i:9">f</span></span> <span class="w"><span class="l" style="--i:10">S</span><span class="l" style="--i:11">t</span><span class="l" style="--i:12">a</span><span class="l" style="--i:13">n</span></span></span></h1>
<section class="contact" aria-label="Contact">
<div class="who"><div class="name">Jainder Bal</div><div class="role">CS student, John Abbott College, Montreal</div></div>
<div class="links"><a href="https://www.linkedin.com/in/jainder/" target="_blank" rel="noopener">LinkedIn</a><div class="mail"><span id="email">baljainder1@gmail.com</span><button id="copy" type="button">Copy</button></div></div>
</section>
<figure class="stage"><div class="card" id="card"><video id="v" controls playsinline preload="metadata" poster="poster.jpg" src="pitch.mp4?v=2" aria-label="Creator Collab Engine pitch video"></video><button class="play" id="play" type="button" aria-label="Play pitch video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2.8v18.4c0 .9 1 1.5 1.8 1l15-9.2c.7-.5.7-1.5 0-2l-15-9.2C6 1.3 5 1.9 5 2.8Z"/></svg></button></div></figure>
</main>
<script>
const card=document.getElementById('card'),v=document.getElementById('v'),copy=document.getElementById('copy');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!calm&&matchMedia('(hover:hover)').matches){
  card.addEventListener('pointermove',e=>{if(!v.paused)return;const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;card.style.setProperty('--ry',((x-.5)*9).toFixed(2)+'deg');card.style.setProperty('--rx',((.5-y)*7+2).toFixed(2)+'deg');card.style.setProperty('--mx',x*100+'%');card.style.setProperty('--my',y*100+'%')});
  card.addEventListener('pointerleave',()=>{['--rx','--ry','--mx','--my'].forEach(k=>card.style.removeProperty(k))});
}
v.addEventListener('play',()=>{['--rx','--ry'].forEach(k=>card.style.removeProperty(k));card.classList.add('playing')});
v.addEventListener('pause',()=>card.classList.remove('playing'));
v.addEventListener('ended',()=>card.classList.remove('playing'));
copy.addEventListener('click',async()=>{const t=document.getElementById('email');try{await navigator.clipboard.writeText(t.textContent);copy.textContent='Copied'}catch(e){const s=getSelection(),n=document.createRange();n.selectNodeContents(t);s.removeAllRanges();s.addRange(n);copy.textContent='Selected'}setTimeout(()=>copy.textContent='Copy',1800)});
const play=document.getElementById('play'),syncPlay=()=>play.classList.toggle('off',!v.paused);
play.addEventListener('click',()=>{v.play().catch(syncPlay)});
['play','playing','pause','ended'].forEach(n=>v.addEventListener(n,syncPlay));syncPlay();
</script>
</body>
</html>
